name: Setup
description: Checkout, configure AWS, install uv, and sync dependencies

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::631969445205:role/github-action-role
        role-session-name: srm-downscaling-role-session
        aws-region: us-west-2
        role-duration-seconds: 21600 # 6h — cover the full blocking pipeline run (role MaxSessionDuration is 12h)

    # Fail here rather than an hour into a run. Five separate missing grants were found
    # the hard way while building the aws-batch executor, each after minutes of build or
    # run time; this names the missing action in seconds.
    - uses: ./.github/actions/preflight-iam

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - run: uv sync --group dev
      shell: bash
