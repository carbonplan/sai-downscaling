name: Setup
description: Checkout, configure AWS, install uv, and sync dependencies

inputs:
  role-to-assume:
    description: IAM role for this job. Tests use the read-only CI role; deploy and processing jobs pass the deploy role.
    required: false
    default: arn:aws:iam::631969445205:role/gha-sai-downscaling-ci
  role-duration-seconds:
    description: Session length. Must not exceed the role's MaxSessionDuration (CI 1h, deploy 6h).
    required: false
    default: "3600"

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        role-session-name: srm-downscaling-role-session
        aws-region: us-west-2
        role-duration-seconds: ${{ inputs.role-duration-seconds }}

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true

    - run: uv sync --group dev
      shell: bash
