name: deploy

on:
    workflow_dispatch:
        inputs:
            model:
                description: "GCM subfolder to run (e.g. cesm2-waccm, miroc-es2h, ukesm), or a single
                    config file relative to configs/qa/ (e.g. cesm2-waccm/cesm2-waccm-g6-southafrica.yaml).
                    Leave blank to run all models."
                required: false
                default: ""
                type: string
            force:
                description: "Force recompute even if cached"
                required: false
                type: boolean
                default: false
            branch:
                description: "Override the icechunk output branch (e.g. v2). Leave blank to use the
                    installed package version."
                required: false
                default: ""
                type: string
    release:
        types:
            - published

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.model || 'production' }}
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read

jobs:
    qa:
        name: QA run (${{ inputs.model || 'all models' }})
        timeout-minutes: 120
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch'
        environment:
            name: qa
        env:
            QA_CONFIG_PATH: ${{ inputs.model == '' && 'configs/qa/' || endsWith(inputs.model, '.yaml') && format('configs/qa/{0}', inputs.model) || format('configs/qa/{0}/', inputs.model) }}
            FORCE: ${{ inputs.force }}
            BRANCH: ${{ inputs.branch }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Validate input datasets (QA)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: uv run bcsd validate --config-path "$QA_CONFIG_PATH"

            - name: Run BCSD pipeline (QA)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: |
                  EXTRA_ARGS=""
                  if [[ "$FORCE" == "true" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --force"
                  fi
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --branch $BRANCH"
                  fi
                  uv run bcsd run --config-path "$QA_CONFIG_PATH" $EXTRA_ARGS

            - name: Validate output datasets (QA)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: |
                  EXTRA_ARGS=""
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="--branch $BRANCH"
                  fi
                  uv run bcsd validate-output --config-path "$QA_CONFIG_PATH" $EXTRA_ARGS

    snapshot:
        # Produces the regional baseline the per-PR snapshot check compares against. It has
        # to run at the release tag, on the same input stores as the production run, so that
        # the next pull request's candidate differs from it only by that pull request's
        # commits. Independent of the production job, so a slow global run does not delay it.
        name: Snapshot baseline run
        timeout-minutes: 120
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        environment:
            name: qa
        env:
            TAG: ${{ github.event.release.tag_name }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}
            - uses: ./.github/actions/setup

            - name: Run BCSD pipeline (snapshot baseline)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              # No --branch: at a release tag the default branch is the package version, which
              # is the name baselines.py cites.
              run: uv run bcsd run --config-path configs/snapshot/cesm2-waccm/

            - name: Validate output datasets (snapshot baseline)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: uv run bcsd validate-output --config-path configs/snapshot/cesm2-waccm/

            - name: Freeze the snapshot baseline under an immutable tag
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              # The branch this wrote to stays writable, so a later qa run with a matching
              # BCSD_BRANCH could overwrite the baseline in place and a comparison would then
              # diff a candidate against itself. The tag pins the snapshot id.
              run: uv run bcsd release --config-path configs/snapshot/cesm2-waccm/ --tag "snapshot-$TAG"

            - name: Report the pointer to update
              run: |
                  echo "### Snapshot baseline produced" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo "Repoint \`CESM2_WACCM_SOUTH_AFRICA\` in \`src/srm/snapshot/baselines.py\`:" >> "$GITHUB_STEP_SUMMARY"
                  echo "" >> "$GITHUB_STEP_SUMMARY"
                  echo '```python' >> "$GITHUB_STEP_SUMMARY"
                  echo "branch=\"$TAG\",  # frozen as tag snapshot-$TAG" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"

    production:
        name: Production run
        timeout-minutes: 360
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        environment:
            name: production
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}
            - uses: ./.github/actions/setup

            - name: Validate input datasets (production)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: uv run bcsd validate --config-path configs/production/cesm2-waccm/

            - name: Run BCSD pipeline (production)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: |
                  uv run bcsd run --config-path configs/production/cesm2-waccm/

            - name: Validate output datasets (production)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: uv run bcsd validate-output --config-path configs/production/cesm2-waccm/
