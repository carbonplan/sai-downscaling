name: deploy

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Which config root to run. qa is regional and cheap; production is
                    global and writes to the published output bucket."
                required: true
                default: qa
                type: choice
                options:
                    - qa
                    - production
            model:
                description: "GCM subfolder to run (e.g. cesm2-waccm, miroc-es2h, ukesm), or a single
                    config file relative to the chosen config root (e.g.
                    cesm2-waccm/cesm2-waccm-g6-southafrica.yaml). Leave blank to run every model
                    for that environment."
                required: false
                default: ""
                type: string
            force:
                description: "Force recompute even if cached"
                required: false
                type: boolean
                default: false
            branch:
                description: "Override the icechunk output branch (e.g. v2). Leave blank to use the
                    installed package version."
                required: false
                default: ""
                type: string
    release:
        types:
            - published

concurrency:
    # The environment is part of the key because qa and production write to separate
    # store prefixes, so a production dispatch must not cancel a qa run of the same model.
    # Two dispatches of the same environment and model do collide by design: they would
    # be two writers on one icechunk branch.
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.environment, inputs.model) || 'release' }}
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read

jobs:
    qa:
        name: QA run (${{ inputs.model || 'all models' }})
        timeout-minutes: 120
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'qa'
        environment:
            name: qa
        env:
            QA_CONFIG_PATH: ${{ inputs.model == '' && 'configs/qa/' || endsWith(inputs.model, '.yaml') && format('configs/qa/{0}', inputs.model) || format('configs/qa/{0}/', inputs.model) }}
            FORCE: ${{ inputs.force }}
            BRANCH: ${{ inputs.branch }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Validate input datasets (QA)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: uv run bcsd validate --config-path "$QA_CONFIG_PATH"

            - name: Run BCSD pipeline (QA)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: |
                  EXTRA_ARGS=""
                  if [[ "$FORCE" == "true" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --force"
                  fi
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --branch $BRANCH"
                  fi
                  uv run bcsd run --config-path "$QA_CONFIG_PATH" $EXTRA_ARGS

            - name: Validate output datasets (QA)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: |
                  EXTRA_ARGS=""
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="--branch $BRANCH"
                  fi
                  uv run bcsd validate-output --config-path "$QA_CONFIG_PATH" $EXTRA_ARGS

    snapshot:
        # Produces the regional baseline the per-PR snapshot check compares against. It has
        # to run at the release tag, on the same input stores as the production run, so that
        # the next pull request's candidate differs from it only by that pull request's
        # commits. Independent of the production job, so a slow global run does not delay it.
        name: Snapshot baseline run
        timeout-minutes: 120
        runs-on: ubuntu-latest
        if: github.event_name == 'release'
        environment:
            name: qa
        env:
            TAG: ${{ github.event.release.tag_name }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name }}
            - uses: ./.github/actions/setup

            - name: Run BCSD pipeline (snapshot baseline)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              # No --branch: at a release tag the default branch is the package version, which
              # is the name baselines.py cites.
              run: uv run bcsd run --config-path configs/snapshot/cesm2-waccm/

            - name: Validate output datasets (snapshot baseline)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: uv run bcsd validate-output --config-path configs/snapshot/cesm2-waccm/

            - name: Freeze the snapshot baseline under an immutable tag
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              # The branch this wrote to stays writable, so a later qa run with a matching
              # BCSD_BRANCH could overwrite the baseline in place and a comparison would then
              # diff a candidate against itself. The tag pins the snapshot id.
              run: uv run bcsd release --config-path configs/snapshot/cesm2-waccm/ --tag "snapshot-$TAG"

            - name: Report the pointer to update
              # Print both fields: `branch` changes every release and `uri` changes when the
              # configs move, so naming only one invites a pointer that cites a store with no
              # such branch. Resolved from the configs so the summary cannot drift from them.
              run: |
                  URI=$(uv run python - <<'PY'
                  from srm.cache import ArtifactCache
                  from srm.cli import load_configs

                  configs, options = load_configs("configs/snapshot/cesm2-waccm/")
                  stores = {ArtifactCache.from_config(c, options)._output_store for c in configs}
                  # One store per (gcm, obs, subset); every snapshot config shares that triple.
                  assert len(stores) == 1, f"expected one snapshot output store, got {sorted(stores)}"
                  print(stores.pop())
                  PY
                  ) || URI="<read output_dir from configs/snapshot/cesm2-waccm/>"
                  {
                      echo "### Snapshot baseline produced"
                      echo ""
                      echo "Repoint \`CESM2_WACCM_SOUTH_AFRICA\` in \`src/srm/snapshot/baselines.py\`:"
                      echo ""
                      echo '```python'
                      echo "CESM2_WACCM_SOUTH_AFRICA = Baseline("
                      echo "    uri=\"$URI\","
                      echo "    branch=\"$TAG\",  # frozen as tag snapshot-$TAG"
                      echo ")"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    production:
        name: Production run (${{ matrix.model }})
        timeout-minutes: 360
        runs-on: ubuntu-latest
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment
            == 'production')
        environment:
            name: production
        strategy:
            # One job per GCM. Each GCM owns its own icechunk store
            # ({gcm}-{obs_dataset}-{subset_id}.icechunk), so parallel models never commit
            # to the same branch and cannot race each other. Splitting any finer, per
            # config file, would break that: the scenario configs of a single GCM share
            # one store, and `bcsd run` also deduplicates the obs and historical stages
            # across every config under the path it is given.
            #
            # Each job gets its own 6h AWS session rather than sharing one across models,
            # which is what a sequential run would exhaust: the CESM2-WACCM run alone
            # takes ~4h.
            #
            # The release list is explicit rather than derived from the directory listing
            # so that adding a folder under configs/production/ cannot silently start a
            # global run at the next release. ukesm is deliberately absent: issue #529
            # leaves a 0.70 K discontinuity at 2015 between our UKESM1.0 historical and
            # the UKESM1.1 ARISE runs, so it is not fit to publish yet.
            fail-fast: false
            matrix:
                model: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.model != '' && format('["{0}"]',
                    inputs.model) || '["cesm2-waccm","miroc-es2h"]') }}
        env:
            # Mirrors the QA job: a value ending in .yaml is a single config file, anything
            # else is a subfolder of every config in it.
            PROD_CONFIG_PATH: ${{ endsWith(matrix.model, '.yaml') && format('configs/production/{0}', matrix.model) || format('configs/production/{0}/', matrix.model) }}
            FORCE: ${{ inputs.force }}
            BRANCH: ${{ inputs.branch }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name || github.ref }}
                  # setuptools_scm derives the package version from git tags and the icechunk
                  # branch defaults to that version, with fallback_version = "999". A shallow
                  # checkout on the dispatch path would therefore write production output to a
                  # branch literally named 999.
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Validate input datasets (production)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: uv run bcsd validate --config-path "$PROD_CONFIG_PATH"

            - name: Run BCSD pipeline (production)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: |
                  EXTRA_ARGS=""
                  if [[ "$FORCE" == "true" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --force"
                  fi
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --branch $BRANCH"
                  fi
                  uv run bcsd run --config-path "$PROD_CONFIG_PATH" $EXTRA_ARGS

            - name: Validate output datasets (production)
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
              run: |
                  EXTRA_ARGS=""
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="--branch $BRANCH"
                  fi
                  uv run bcsd validate-output --config-path "$PROD_CONFIG_PATH" $EXTRA_ARGS
