name: deploy

on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Which config root to run. qa is regional and cheap; production is
                    global and writes to the published output bucket."
                required: true
                default: qa
                type: choice
                options:
                    - qa
                    - production
                    - snapshot
            model:
                description: "GCM subfolder to run (e.g. cesm2-waccm6, ukesm1-1-ll), or a single
                    config file relative to the chosen config root (e.g.
                    cesm2-waccm6/cesm2-waccm6-g6-southafrica.yaml). Leave blank to run every model
                    for that environment. Production accepts only the models on the allowlist in
                    the `models` job, currently cesm2-waccm6 and ukesm1-1-ll; qa accepts any
                    subfolder."
                required: false
                default: ""
                type: string
            force:
                description: "Force recompute even if cached"
                required: false
                type: boolean
                default: false
            branch:
                description: "Override the icechunk output branch (e.g. v2). Leave blank to use the
                    installed package version."
                required: false
                default: ""
                type: string
    release:
        types:
            - published

concurrency:
    # The environment is part of the key because qa and production write to separate
    # store prefixes, so a production dispatch must not cancel a qa run of the same model.
    # Two dispatches of the same environment and model do collide by design: they would
    # be two writers on one icechunk branch.
    group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.environment, inputs.model) || 'release' }}
    cancel-in-progress: true

permissions:
    id-token: write
    contents: read

jobs:
    image:
        # Builds the container the AWS Batch tasks run and pins a job definition revision to
        # it. Both run jobs depend on this, so a deploy cannot execute a stale image: the
        # revision it submits against was built from this very commit.
        name: Build task image
        uses: ./.github/workflows/build-image.yml
        permissions:
            id-token: write
            contents: read

    qa:
        name: QA run (${{ inputs.model || 'all models' }})
        timeout-minutes: 120
        runs-on: ubuntu-latest
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'qa'
        needs: image
        environment:
            name: qa
        env:
            BCSD_BATCH_JOB_QUEUE: srm-qa
            BCSD_BATCH_JOB_DEFINITION: ${{ needs.image.outputs.job_definition }}
            QA_CONFIG_PATH: ${{ inputs.model == '' && 'configs/qa/' || endsWith(inputs.model, '.yaml') && format('configs/qa/{0}', inputs.model) || format('configs/qa/{0}/', inputs.model) }}
            FORCE: ${{ inputs.force }}
            BRANCH: ${{ inputs.branch }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Validate input datasets (QA)
              uses: ./.github/actions/batch-run
              with:
                  name: validate-input-qa
                  command: '["bcsd","validate","--config-path","${{ env.QA_CONFIG_PATH }}","--no-coiled"]'
                  job-queue: ${{ env.BCSD_BATCH_JOB_QUEUE }}
                  job-definition: ${{ needs.image.outputs.job_definition }}

            - name: Run BCSD pipeline (QA)
              # No Coiled token anywhere in this job: the pipeline tasks and both validate
              # steps all run on AWS Batch under the OIDC role the setup action assumes.
              run: |
                  EXTRA_ARGS=""
                  if [[ "$FORCE" == "true" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --force"
                  fi
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --branch $BRANCH"
                  fi
                  uv run bcsd run --config-path "$QA_CONFIG_PATH" --executor aws-batch $EXTRA_ARGS

            - name: Build the output validation command (QA)
              id: validate-output-cmd
              # jq builds the array so an optional --branch cannot be word-split into it.
              # One argument per line rather than jq --args: --args does not stop jq from
              # parsing a value like --config-path as one of its own options, and the
              # failure is silent, since the command substitution still exits 0 and hands
              # the next step an empty string.
              run: |
                  set -euo pipefail
                  # Resolve the branch here rather than letting the container default it.
                  # PipelineOptions.branch falls back to the installed package version, and
                  # the container's copy is baked at image build time, so leaving it
                  # implicit means the writer and the reader derive it separately.
                  RESOLVED="$BRANCH"
                  if [[ -z "$RESOLVED" ]]; then
                    RESOLVED=$(uv run bcsd resolve-branch --config-path "$QA_CONFIG_PATH")
                  fi
                  ARGS=(bcsd validate-output --config-path "$QA_CONFIG_PATH" --no-coiled --branch "$RESOLVED")
                  JSON=$(printf '%s\n' "${ARGS[@]}" | jq -Rsc 'split("\n")[:-1]')
                  if [[ -z "$JSON" || "$JSON" == "null" ]]; then
                    echo "::error::failed to build the validate-output command array"
                    exit 1
                  fi
                  echo "json=$JSON" >> "$GITHUB_OUTPUT"

            - name: Validate output datasets (QA)
              uses: ./.github/actions/batch-run
              with:
                  name: validate-output-qa
                  command: ${{ steps.validate-output-cmd.outputs.json }}
                  job-queue: ${{ env.BCSD_BATCH_JOB_QUEUE }}
                  job-definition: ${{ needs.image.outputs.job_definition }}

    snapshot:
        # Produces the regional baseline the per-PR snapshot check compares against. It has
        # to run at the release tag, on the same input stores as the production run, so that
        # the next pull request's candidate differs from it only by that pull request's
        # commits. Independent of the production job, so a slow global run does not delay it.
        name: Snapshot baseline run
        timeout-minutes: 120
        runs-on: ubuntu-latest
        # Dispatchable as well as release-triggered, so a baseline can be produced from a
        # pull request's head commit without cutting a release. `gh workflow run deploy.yml
        # --ref <pr-branch> -f environment=snapshot` reaches it, because workflow_dispatch
        # takes any ref in this repository. Fork pull requests cannot, since their head is
        # not a ref here.
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment
            == 'snapshot')
        needs: image
        environment:
            name: qa
        env:
            TAG: ${{ github.event.release.tag_name }}
            BRANCH: ${{ inputs.branch }}
            # The srm-qa queue, not srm-production: this runs alongside the production job
            # on the same release, and the baseline is a small regional run that must not
            # delay the global one. srm-production outranks it on the shared compute
            # environment.
            BCSD_BATCH_JOB_QUEUE: srm-qa
            BCSD_BATCH_JOB_DEFINITION: ${{ needs.image.outputs.job_definition }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name || github.ref }}
                  # setuptools_scm names the icechunk branch, and a shallow checkout off a
                  # non-tag ref resolves to the fallback version 999. A release tag survives
                  # depth 1 because `git describe` finds the tag on HEAD; a pull request's
                  # head does not, and the run would write to a branch literally named v999.
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Run BCSD pipeline (snapshot baseline)
              # At a release tag the default branch is the package version, which is the name
              # baselines.py cites, so a release passes nothing. A dispatch off a pull request
              # resolves to a development version such as v0.13.0.post50, which is isolated
              # from any release baseline by construction; --branch overrides that when you
              # want a name you chose.
              run: |
                  EXTRA_ARGS=""
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="--branch $BRANCH"
                  fi
                  uv run bcsd run --config-path configs/snapshot/cesm2-waccm6/ --executor aws-batch $EXTRA_ARGS

            - name: Build the output validation command (snapshot baseline)
              id: validate-output-cmd
              # The snapshot job never passes a branch, so without this the container would
              # derive it from its own baked package version while the run derived it from
              # the runner's. They agree at a release tag by coincidence, not by construction.
              run: |
                  set -euo pipefail
                  RESOLVED="$BRANCH"
                  if [[ -z "$RESOLVED" ]]; then
                    RESOLVED=$(uv run bcsd resolve-branch --config-path configs/snapshot/cesm2-waccm6/)
                  fi
                  ARGS=(bcsd validate-output --config-path configs/snapshot/cesm2-waccm6/ --no-coiled --branch "$RESOLVED")
                  JSON=$(printf '%s\n' "${ARGS[@]}" | jq -Rsc 'split("\n")[:-1]')
                  if [[ -z "$JSON" || "$JSON" == "null" ]]; then
                    echo "::error::failed to build the validate-output command array"
                    exit 1
                  fi
                  echo "json=$JSON" >> "$GITHUB_OUTPUT"

            - name: Validate output datasets (snapshot baseline)
              uses: ./.github/actions/batch-run
              with:
                  name: validate-output-snapshot
                  command: ${{ steps.validate-output-cmd.outputs.json }}
                  job-queue: ${{ env.BCSD_BATCH_JOB_QUEUE }}
                  job-definition: ${{ needs.image.outputs.job_definition }}

            - name: Freeze the snapshot baseline under an immutable tag
              # Releases only. An ad-hoc dispatch must not mint something that looks
              # blessed: the tag is what makes a baseline citable, and a casual run from a
              # pull request branch has not been reviewed or pointed at by baselines.py.
              # It would also have no release tag to name itself after.
              if: github.event_name == 'release'
              # No Coiled token: `bcsd release` only moves an icechunk ref and opens no
              # cluster at all, so it never needed one.
              # The branch this wrote to stays writable, so a later qa run with a matching
              # BCSD_BRANCH could overwrite the baseline in place and a comparison would then
              # diff a candidate against itself. The tag pins the snapshot id.
              run: uv run bcsd release --config-path configs/snapshot/cesm2-waccm6/ --tag "snapshot-$TAG"

            - name: Report the pointer to update
              # Print both fields: `branch` changes every release and `uri` changes when the
              # configs move, so naming only one invites a pointer that cites a store with no
              # such branch. Resolved from the configs so the summary cannot drift from them.
              run: |
                  URI=$(uv run python - <<'PY'
                  from saidownscale.cache import ArtifactCache
                  from saidownscale.cli import load_configs

                  configs, options = load_configs("configs/snapshot/cesm2-waccm6/")
                  stores = {ArtifactCache.from_config(c, options)._output_store for c in configs}
                  # One store per (gcm, obs, subset); every snapshot config shares that triple.
                  assert len(stores) == 1, f"expected one snapshot output store, got {sorted(stores)}"
                  print(stores.pop())
                  PY
                  ) || URI="<read output_dir from configs/snapshot/cesm2-waccm6/>"
                  {
                      echo "### Snapshot baseline produced"
                      echo ""
                      echo "Repoint \`CESM2_WACCM_SOUTH_AFRICA\` in \`src/saidownscale/snapshot/baselines.py\`:"
                      echo ""
                      echo '```python'
                      echo "CESM2_WACCM_SOUTH_AFRICA = Baseline("
                      echo "    uri=\"$URI\","
                      echo "    branch=\"$TAG\",  # frozen as tag snapshot-$TAG"
                      echo ")"
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

    models:
        # Single source of truth for which GCMs a release runs. Both the cost plan and the
        # run itself consume it, so an estimate can never cover a different set of models
        # than the matrix that follows it.
        name: Resolve model list
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment
            == 'production')
        runs-on: ubuntu-latest
        outputs:
            list: ${{ steps.resolve.outputs.list }}
        steps:
            - id: resolve
              env:
                  MODEL: ${{ inputs.model }}
                  # The allowlist itself. A dispatch is checked against it too, so the
                  # comment below holds for every trigger rather than releases alone.
                  ALLOWED: cesm2-waccm6 ukesm1-1-ll
              # The release list is explicit rather than derived from the directory listing,
              # so adding a folder under configs/production/ cannot silently start a global
              # run at the next release.
              #
              # miroc-es2h is absent because the deliverable is CESM and UKESM only; its
              # configs have been removed outright rather than left unloadable.
              run: |
                  if [[ -n "$MODEL" ]]; then
                    # A model may name a folder or a single config file beneath it.
                    ROOT="${MODEL%%/*}"
                    if ! grep -qxF "$ROOT" <<<"$(tr ' ' '\n' <<<"$ALLOWED")"; then
                      echo "::error::model '$MODEL' is not in the production allowlist ($ALLOWED)."
                      exit 1
                    fi
                    LIST=$(jq -cn --arg m "$MODEL" '[$m]')
                  else
                    LIST=$(tr ' ' '\n' <<<"$ALLOWED" | jq -Rcn '[inputs | select(. != "")]')
                  fi
                  echo "list=$LIST" >> "$GITHUB_OUTPUT"
                  echo "Models to run: $LIST" >> "$GITHUB_STEP_SUMMARY"

    plan:
        # Renders the cost estimate into the job summary so the reviewer who releases the
        # production environment is approving a number rather than a blank prompt. Enable
        # the gate itself under Settings > Environments > production > required reviewers;
        # without it this job is informational only.
        name: Cost plan (${{ matrix.model }})
        # Informational only. Without this a transient S3 error while probing the cache
        # would skip the production run entirely, because `needs` treats a failed
        # dependency as a skip no matter what the dependent job's `if` says.
        continue-on-error: true
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment
            == 'production')
        needs: [models, image]
        runs-on: ubuntu-latest
        # Generous: the step syncs the dev dependency group and then probes the cache for
        # every stage of every production leaf. Timing out here is indistinguishable from
        # success at the approval screen, because the job is continue-on-error.
        timeout-minutes: 30
        strategy:
            matrix:
                model: ${{ fromJSON(needs.models.outputs.list) }}
        env:
            PLAN_CONFIG_PATH: ${{ endsWith(matrix.model, '.yaml') && format('configs/production/{0}', matrix.model) || format('configs/production/{0}/', matrix.model) }}
            # The same pinned revision production submits against, so the image the
            # reviewer approves is the image that runs.
            BCSD_BATCH_JOB_DEFINITION: ${{ needs.image.outputs.job_definition }}
            FORCE: ${{ inputs.force }}
            BRANCH: ${{ inputs.branch }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name || github.ref }}
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Estimate cost
              run: |
                  EXTRA_ARGS=""
                  if [[ "$FORCE" == "true" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --force"
                  fi
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --branch $BRANCH"
                  fi
                  set +e
                  uv run bcsd run --config-path "$PLAN_CONFIG_PATH" \
                    --executor aws-batch --dry-run $EXTRA_ARGS >plan.txt 2>&1
                  STATUS=$?
                  set -e

                  cat plan.txt
                  {
                    echo "### Production cost estimate: ${{ matrix.model }}"
                    echo
                    echo '```'
                    cat plan.txt
                    echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit $STATUS

    production:
        name: Production run (${{ matrix.model }})
        timeout-minutes: 360
        runs-on: ubuntu-latest
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment
            == 'production')
        needs: [image, plan, models]
        environment:
            name: production
        strategy:
            # One job per GCM. Each GCM owns its own icechunk store
            # ({gcm}-{obs_dataset}-{subset_id}.icechunk), so parallel models never commit
            # to the same branch and cannot race each other. Splitting any finer, per
            # config file, would break that: the scenario configs of a single GCM share
            # one store, and `bcsd run` also deduplicates the obs and historical stages
            # across every config under the path it is given.
            #
            # Each job gets its own 6h AWS session rather than sharing one across models,
            # which is what a sequential run would exhaust: the CESM2-WACCM run alone
            # takes ~4h.
            #
            # Which models run, and why the list is an explicit allowlist, is decided by the
            # `models` job above.
            fail-fast: false
            matrix:
                model: ${{ fromJSON(needs.models.outputs.list) }}
        env:
            # Mirrors the QA job: a value ending in .yaml is a single config file, anything
            # else is a subfolder of every config in it.
            PROD_CONFIG_PATH: ${{ endsWith(matrix.model, '.yaml') && format('configs/production/{0}', matrix.model) || format('configs/production/{0}/', matrix.model) }}
            FORCE: ${{ inputs.force }}
            BRANCH: ${{ inputs.branch }}
            BCSD_BATCH_JOB_QUEUE: srm-production
            BCSD_BATCH_JOB_DEFINITION: ${{ needs.image.outputs.job_definition }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ github.event.release.tag_name || github.ref }}
                  # setuptools_scm derives the package version from git tags and the icechunk
                  # branch defaults to that version, with fallback_version = "999". A shallow
                  # checkout on the dispatch path would therefore write production output to a
                  # branch literally named 999.
                  fetch-depth: 0
            - uses: ./.github/actions/setup

            - name: Validate input datasets (production)
              uses: ./.github/actions/batch-run
              with:
                  name: validate-input-production
                  command: '["bcsd","validate","--config-path","${{ env.PROD_CONFIG_PATH }}","--no-coiled"]'
                  job-queue: ${{ env.BCSD_BATCH_JOB_QUEUE }}
                  job-definition: ${{ needs.image.outputs.job_definition }}
                  # Global stores, so twice the regional default on both axes.
                  vcpu: "32"
                  memory: "245760"

            - name: Run BCSD pipeline (production)
              # No Coiled token anywhere in this job: the pipeline tasks and both validate
              # steps all run on AWS Batch under the OIDC role the setup action assumes.
              run: |
                  EXTRA_ARGS=""
                  if [[ "$FORCE" == "true" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --force"
                  fi
                  if [[ -n "$BRANCH" ]]; then
                    EXTRA_ARGS="$EXTRA_ARGS --branch $BRANCH"
                  fi
                  uv run bcsd run --config-path "$PROD_CONFIG_PATH" --executor aws-batch $EXTRA_ARGS

            - name: Build the output validation command (production)
              id: validate-output-cmd
              # jq builds the array so an optional --branch cannot be word-split into it.
              # One argument per line rather than jq --args: --args does not stop jq from
              # parsing a value like --config-path as one of its own options, and the
              # failure is silent, since the command substitution still exits 0 and hands
              # the next step an empty string.
              run: |
                  set -euo pipefail
                  # Resolve the branch here rather than letting the container default it.
                  # PipelineOptions.branch falls back to the installed package version, and
                  # the container's copy is baked at image build time, so leaving it
                  # implicit means the writer and the reader derive it separately.
                  RESOLVED="$BRANCH"
                  if [[ -z "$RESOLVED" ]]; then
                    RESOLVED=$(uv run bcsd resolve-branch --config-path "$PROD_CONFIG_PATH")
                  fi
                  ARGS=(bcsd validate-output --config-path "$PROD_CONFIG_PATH" --no-coiled --branch "$RESOLVED")
                  JSON=$(printf '%s\n' "${ARGS[@]}" | jq -Rsc 'split("\n")[:-1]')
                  if [[ -z "$JSON" || "$JSON" == "null" ]]; then
                    echo "::error::failed to build the validate-output command array"
                    exit 1
                  fi
                  echo "json=$JSON" >> "$GITHUB_OUTPUT"

            - name: Validate output datasets (production)
              uses: ./.github/actions/batch-run
              with:
                  name: validate-output-production
                  command: ${{ steps.validate-output-cmd.outputs.json }}
                  job-queue: ${{ env.BCSD_BATCH_JOB_QUEUE }}
                  job-definition: ${{ needs.image.outputs.job_definition }}
                  # Global stores, so twice the regional default on both axes.
                  vcpu: "32"
                  memory: "245760"
