name: pre-commit

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install uv 
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: deps
        run: uv sync --group dev
        
      - name: run pre-commit
        run: uv run pre-commit run --all-files
