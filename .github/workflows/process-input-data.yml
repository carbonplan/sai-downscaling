name: process input data

on:
    workflow_dispatch:
        inputs:
            gcm:
                description: "GCM to process"
                required: true
                type: choice
                options:
                    - CESM2-WACCM
                    - MIROC-ES2H
                    - UKESM
                    - NASA-NEX
            scenario:
                description: >
                    Scenario name. Valid values —
                    CESM2-WACCM: pangeo-historical historical ssp245 G6-1.5K |
                    MIROC-ES2H: historical ssp245 G6-1.5K baseline |
                    UKESM: historical SSP245 SSP245-t-pr G6-1.5K G6-1.5K-t-pr |
                    NASA-NEX: historical SSP245
                required: true
                type: string
            s3_cleanup_path:
                description: "S3 prefix to delete before processing (e.g. s3://carbonplan-srm/input/tensor/CESM2/CESM2-WACCM-SSP245/icechunk/CESM2_WACCM_SSP245.icechunk/). Leave empty to skip."
                required: false
                type: string
                default: ""
            extra_flags:
                description: "Additional flags for the process command (e.g. --subset)"
                required: false
                type: string
                default: ""

permissions:
    id-token: write
    contents: read

jobs:
    process:
        name: "${{ inputs.gcm }} / ${{ inputs.scenario }}"
        runs-on: ubuntu-latest
        timeout-minutes: 480
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/setup

            - name: Clean S3 icechunk store
              if: inputs.s3_cleanup_path != ''
              env:
                  S3_CLEANUP_PATH: ${{ inputs.s3_cleanup_path }}
              run: aws s3 rm "$S3_CLEANUP_PATH" --recursive

            - name: Process ${{ inputs.gcm }} / ${{ inputs.scenario }}
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
                  GCM: ${{ inputs.gcm }}
                  SCENARIO: ${{ inputs.scenario }}
                  EXTRA_FLAGS: ${{ inputs.extra_flags }}
              run: |
                  case "$GCM" in
                    "CESM2-WACCM")
                      SCRIPT="src/srm/input_data/tensor/CMIP6/CESM2-WACCM/process-CESM2-WACCM.py"
                      FLAGS="--all-variables"
                      ;;
                    "MIROC-ES2H")
                      SCRIPT="src/srm/input_data/tensor/CMIP6/MIROC-ES2H/process_MIROC.py"
                      FLAGS="--all-variables"
                      ;;
                    "UKESM")
                      SCRIPT="src/srm/input_data/tensor/CMIP6/UKESM/process_UKESM.py"
                      FLAGS="--all-variables"
                      ;;
                    "NASA-NEX")
                      SCRIPT="src/srm/input_data/tensor/CMIP6/NASA-NEX/process_NASA_NEX.py"
                      FLAGS=""
                      ;;
                  esac
                  uv run "$SCRIPT" process $FLAGS --coiled --scenario "$SCENARIO" $EXTRA_FLAGS

            - name: Write job summary
              if: success()
              env:
                  GCM: ${{ inputs.gcm }}
                  SCENARIO: ${{ inputs.scenario }}
              run: uv run src/srm/input_data/show_summary.py "$GCM" "$SCENARIO"
