name: process input data

on:
    workflow_dispatch:
        inputs:
            gcm:
                description: "GCM to process"
                required: true
                type: choice
                options:
                    - CESM2-WACCM
                    - MIROC-ES2H
                    - UKESM
                    - NASA-NEX
            scenario:
                description: >
                    Scenario(s) to process (comma-separated). Valid values —
                    CESM2-WACCM: historical,ssp245,G6-1.5K,G6-1.5K-END |
                    MIROC-ES2H: historical,esgf-ssp245,ssp245,G6-1.5K |
                    UKESM: historical,SSP245,G6-1.5K |
                    NASA-NEX: historical,SSP245
                required: true
                type: string
            extra_flags:
                description: "Additional flags for the process command (e.g. --subset)"
                required: false
                type: string
                default: ""

permissions:
    id-token: write
    contents: read

jobs:
    process:
        name: "${{ inputs.gcm }} / ${{ inputs.scenario }}"
        runs-on: ubuntu-latest
        timeout-minutes: 480
        steps:
            - uses: actions/checkout@v7
            - uses: ./.github/actions/setup

            - name: Process ${{ inputs.gcm }} / ${{ inputs.scenario }}
              env:
                  DASK_COILED__TOKEN: ${{ secrets.DASK_COILED__TOKEN }}
                  GCM: ${{ inputs.gcm }}
                  SCENARIO: ${{ inputs.scenario }}
                  EXTRA_FLAGS: ${{ inputs.extra_flags }}
              run: |
                  case "$GCM" in
                    "CESM2-WACCM")
                      SCRIPT="src/saidownscale/input_data/cesm2_waccm.py"
                      SUBCOMMAND=""
                      FLAGS="--all-variables"
                      ;;
                    "MIROC-ES2H")
                      SCRIPT="src/saidownscale/input_data/miroc.py"
                      SUBCOMMAND="process"
                      FLAGS="--all-variables"
                      ;;
                    "UKESM")
                      SCRIPT="src/saidownscale/input_data/ukesm.py"
                      SUBCOMMAND="process"
                      FLAGS="--all-variables"
                      ;;
                    "NASA-NEX")
                      SCRIPT="src/saidownscale/input_data/nasa_nex.py"
                      SUBCOMMAND=""
                      FLAGS=""
                      ;;
                  esac

                  SCENARIO_FLAGS=()
                  IFS=',' read -ra SCENARIOS <<< "$SCENARIO"
                  for s in "${SCENARIOS[@]}"; do
                    SCENARIO_FLAGS+=(--scenario "$(echo "$s" | xargs)")
                  done

                  uv run coiled batch run -- python "$SCRIPT" $SUBCOMMAND $FLAGS "${SCENARIO_FLAGS[@]}" $EXTRA_FLAGS

            - name: Write job summary
              if: success()
              env:
                  GCM: ${{ inputs.gcm }}
                  SCENARIO: ${{ inputs.scenario }}
              run: uv run src/saidownscale/input_data/show_summary.py "$GCM" "$SCENARIO"
