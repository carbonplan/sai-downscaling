name: snapshot-required

on:
    pull_request:
        types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

jobs:
    gate:
        name: snapshot gate
        if: ${{ !github.event.pull_request.draft }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Detect modeling-relevant changes
              id: changed
              env:
                  # SHAs are not attacker-controllable free text, but pass them via
                  # env (not inline ${{ }}) to follow workflow-injection best practice.
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
                  FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
                  echo "changed files:"; echo "$FILES"
                  # Modeling-relevant = changes to the downscaling computation under src/saidownscale/.
                  # Excluded: the snapshot harness and ETL packages (snapshot/, input_data/) and
                  # the plumbing/viz/validation modules that do not affect model output (cli,
                  # cache, encoding, batch_runner, analysis, plotting, validation). Changes
                  # anywhere else (configs, deps, tests, docs, notebooks) do not trigger the gate.
                  RELEVANT="$(echo "$FILES" \
                    | grep -E '^src/saidownscale/' \
                    | grep -vE '^src/saidownscale/(snapshot|input_data)/' \
                    | grep -vE '^src/saidownscale/(analysis|batch_runner|cache|cli|encoding|plotting|validation|qaqc|qa_flags|qa_flags_runner)\.py$' \
                    || true)"
                  echo "modeling-relevant files:"; echo "$RELEVANT"
                  if [[ -z "$RELEVANT" ]]; then
                    echo "modeling=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "modeling=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Enforce snapshot verification
              env:
                  MODELING: ${{ steps.changed.outputs.modeling }}
                  HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'snapshot-verified') }}
              run: |
                  if [[ "$MODELING" == "false" ]]; then
                    echo "Only docs/notebooks changed — snapshot test not required." | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  if [[ "$HAS_LABEL" == "true" ]]; then
                    echo "✅ \`snapshot-verified\` label present — snapshot gate satisfied." | tee -a "$GITHUB_STEP_SUMMARY"
                    exit 0
                  fi
                  cat >> "$GITHUB_STEP_SUMMARY" <<'CHECKLIST'
                  ## ❌ Snapshot verification required

                  Modeling code changed in this PR, so it must pass the snapshot regression check before it can merge (see `docs/explanation/snapshot-testing.md`).

                  ### Pre-merge checklist

                  Before merging, the author will:

                  1. Do a cheap test run over South Africa for the **same single ensemble member** as the snapshot global run, and
                  2. Run the comparison notebook (`docs/how-to/snapshot-comparison.ipynb`) against the snapshot and **commit it to this PR**.

                  **If there is no change and you did not expect one** — merge.

                  **If there is a change, or no change but you expected one:**

                  1. Do a full global run and expand the comparison notebook to include a **global** comparison against the snapshot.
                  2. Document clearly **what** changed in the data and **why**, and get approval from **Claire or Ori** that it makes sense.
                  3. Merge.
                  4. Update the snapshot to point to the new global run (`src/saidownscale/snapshot/baselines.py`).

                  When done, add the **`snapshot-verified`** label to this PR to satisfy this gate.
                  CHECKLIST
                  echo "::error::Modeling code changed — complete the snapshot pre-merge checklist in the job summary, then add the 'snapshot-verified' label."
                  exit 1
