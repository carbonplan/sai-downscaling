ci:
  autoupdate_schedule: monthly
exclude: ^(notebooks/generate_example_data.ipynb|uv.lock)$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.13
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: no-cluster-tokens-in-nb
        name: block cluster tokens in notebook outputs
        entry: python scripts/check_nb_no_secrets.py
        language: system
        files: \.ipynb$
