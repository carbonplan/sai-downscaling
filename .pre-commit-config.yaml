ci:
  autoupdate_schedule: monthly
# Frozen notebook areas. archive/ and check_BCSD_implementation/ predate the
# saidownscale rename and are not kept current; issues/ is an untracked scratch
# area, and the ruff hook walks the tree rather than the file list, so without
# this it rewrites files that were never staged.
exclude: |
  (?x)^(
    notebooks/archive/.*|
    notebooks/check_BCSD_implementation/.*|
    notebooks/issues/.*|
    uv\.lock
  )$

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.13
    hooks:
      # Run the linter.
      - id: ruff-check
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
