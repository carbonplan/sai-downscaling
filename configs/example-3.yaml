# Example BCSD configuration
#
# This shows all available configuration options for the BCSD downscaling pipeline.
# You can create multiple config files (one per ensemble member/scenario) and run
# the CLI on a directory to batch process them all.
#
# Fields are parsed into two classes from this flat YAML:
#   BCSDConfig     — run identity (affects computation and cache keys)
#   PipelineOptions — operational settings (paths, flags; does not affect results)

# === BCSDConfig: Run Identity ===
gcm: "CESM2-WACCM" # GCM model name
variable: "tasmax" # Variable: tas, tasmax, pr, rsds
ensemble_member: "r1i1p1f1" # Ensemble member label. CESM2-WACCM SSP245/historical: ripf label (e.g. 'r1i1p1f1'). CESM2-WACCM G6-1.5K: CESM run number (e.g. '001', '002', '003'). MIROC/UKESM: ripf label (e.g. 'r1i1p4f2').
scenario: "SSP245" # Scenario: historical, SSP245, G6-1pt5k, G6sulfur, G6solar

# Historical period for training bias correction
train_period_start: 1978
train_period_end: 2014

# Prediction periods for scenarios (not needed for historical-only)
predict_period_start: 2015
predict_period_end: 2100

# Spatial subsetting (optional). Format: [lat_min, lat_max, lon_min, lon_max]
# subset_bounds: [-35, -22, 16, 33] # South Africa region

# Bias correction method
# mapping_type: "parametric"          # "parametric", "nonparametric", or "nonparametric_hybrid" (default: "parametric")

# === PipelineOptions: Operational Settings ===
scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache" # Cache for intermediate artifacts (obs, historical)
output_dir: "s3://carbonplan-scratch/srm/outputs/" # Final scenario outputs (published results)
environment: "qa" # Environment: qa, production (default: qa, can override with BCSD_ENVIRONMENT env var)
# version defaults to the installed package version (e.g. "v0.6.0.post12"). Override with BCSD_VERSION env var or --version CLI flag to pin a specific cache namespace.
# version: "v0.6.0.post5"
# verbose: true                       # Enable verbose logging (default: true)
# rechunk_workflow: true              # Enable strategic rechunking (default: true)
# apply_ocean_mask: true              # Mask ocean pixels to NaN in final output (default: true)
# save_intermediate: false            # Save intermediate artifacts for debugging (default: false)
