# BCSD configuration: CESM2-WACCM / G6-1.5K / all variables / global (production)
#
# Equivalent CLI command:
#   uv run bcsd run --config-path configs/production/cesm2-waccm-g6.yaml

# === BCSDConfig: Run Identity ===
gcm: "CESM2-WACCM"
variables: ["tas", "pr", "rsds", "hurs", "tasmax", "tasmin", "dtr"]
ensemble_members: ["003"]
scenarios: ["G6-1.5K"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2035
predict_period_end: 2084

debias_approach: "nonparametric_hybrid_2sided"

# === PipelineOptions: Operational Settings ===
scratch_dir: "s3://carbonplan-scratch/srm/cache"
output_dir: "s3://us-west-2.opendata.source.coop/carbonplan/srm-downscaling/output/"

environment: "production"
# version intentionally unset — derived from the installed package version at runtime
verbose: true
save_intermediate: true
