# BCSD configuration: CESM2-WACCM / SSP245 / standard variables (production)
#
# Standard variables (tas/pr/rsds/hurs) for full-length SSP245 member 003, which
# reaches 2099. Truncated member 008 (data ends 2069) is downscaled in
# cesm2-waccm-ssp245-std-trunc.yaml so each config's predict_period_end matches its
# members' real data extent. tasmax/tasmin/dtr are split into
# cesm2-waccm-ssp245-tmx.yaml because the corrected temperature extremes only exist
# for members 006-010 (CMIP6 bug).
#
# Equivalent CLI command:
#   uv run bcsd run --config-path configs/production/

# === BCSDConfig: Run Identity ===
gcm: "CESM2-WACCM"
variables: ["pr"]
ensemble_members: ["003"]
scenarios: ["SSP245"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2099

# === PipelineOptions: Operational Settings ===
scratch_dir: "s3://carbonplan-scratch/srm/cache"
output_dir: "s3://carbonplan-scratch/srm/output"

environment: "qa"
branch: "qdm-test"
# version intentionally unset — derived from the installed package version at runtime
verbose: true
save_intermediate: true

# Variable-specific settings (auto-loaded from per-variable defaults if not specified)
variable_config:
  detrend_data: true                   # Whether to detrend (auto-set based on variable)
  detrend_method: "additive"           # "additive" or "multiplicative" trend model
  do_windowing: true                   # Use a running window for quantile mapping
  running_window_length: 31            # Running-window length in days (default: 31)
  downscaling_method: "additive"       # "additive" for temperature-like vars, "multiplicative" for pr/rsds
  downscaling_clim_method: "fft"       # "fft" or "simple" climatology smoothing
  debias_approach: "qdm"  # parametric, nonparametric, nonparametric_hybrid, nonparametric_hybrid_2sided

# Per-variable overrides, keyed by variable name (matrix configs only)
variable_overrides:
  dtr:
    debias_approach: "nonparametric"
