# BCSD configuration: CESM2-WACCM / SSP245 / standard variables (production)
#
# Standard variables (tas/pr/rsds/hurs) are available for SSP245 members 001-010.
# tasmax/tasmin/dtr are split into cesm2-waccm-ssp245-tmx.yaml because the
# corrected temperature extremes only exist for members 006-010 (CMIP6 bug).
#
# Equivalent CLI command:
#   uv run bcsd run --config-path configs/production/

# === BCSDConfig: Run Identity ===
gcm: "CESM2-WACCM"
variables: ["tas", "pr", "rsds", "hurs"]
ensemble_members: ["003", "008"]
scenarios: ["SSP245"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2099

mapping_type: "nonparametric_hybrid"

# === PipelineOptions: Operational Settings ===
scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-srm/output"
environment: "production"
# version intentionally unset — derived from the installed package version at runtime
verbose: true
save_intermediate: true
