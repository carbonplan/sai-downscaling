# BCSD configuration: CESM2-WACCM / tas / SSP245 / truncated member 006 / global (production)
# Member 006's data ends 2069-12-31 (per srm.validation._MEMBER_TIME_BOUNDS), so
# predict_period_end is 2069. Members 007-010 end 2070 and live in
# cesm2-waccm-ssp245-tas-global-trunc-2070.yaml. Splitting the batch by true data end
# keeps each member's tas extent consistent with its other variables and with the qa /
# snapshot runs; batching all of 006-010 at the 2069 group min previously truncated
# 007-010's tas by a year. Full-length members 001-005 reach 2099.

# === Model and Scenario ===
gcm: "CESM2-WACCM"
variables: ["tas"]
ensemble_members: ["006"]
scenarios: ["SSP245"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2069

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/cache"
output_dir: "s3://us-west-2.opendata.source.coop/carbonplan/output/"

environment: "production"
# version intentionally unset — derived from the installed package version at runtime

# === Bias Correction ===
debias_approach: "nonparametric_hybrid_2sided"

# === Additional Options ===
verbose: true
save_intermediate: true
