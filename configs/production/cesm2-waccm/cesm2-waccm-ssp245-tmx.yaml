# BCSD configuration: CESM2-WACCM / SSP245 / temperature extremes (production)
#
# tasmax/tasmin (and derived dtr) use the corrected historical run and only exist
# for SSP245 members 006-010; members 001-005 are standard-vars-only due to the
# CMIP6 tasmax/tasmin bug. Standard variables live in cesm2-waccm-ssp245-std.yaml.
# Member 008's data ends 2069-12-31 (one stray non-NaN day at 2070-01-01, rest of 2070
# is NaN), so predict_period_end is clamped to 2069 to avoid downscaling past its valid
# extent.
#
# Equivalent CLI command:
#   uv run bcsd run --config-path configs/production/

# === BCSDConfig: Run Identity ===
gcm: "CESM2-WACCM"
variables: ["tasmax", "tasmin", "dtr"]
ensemble_members: ["008"]
scenarios: ["SSP245"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2069

debias_approach: "nonparametric_hybrid_2sided"

# === PipelineOptions: Operational Settings ===
scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-srm/output"
environment: "production"
# version intentionally unset — derived from the installed package version at runtime
verbose: true
save_intermediate: true
