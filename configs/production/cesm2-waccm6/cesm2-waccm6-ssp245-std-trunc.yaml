# BCSD configuration: CESM2-WACCM6 / SSP245 / standard variables / truncated members 007-010 (production)
#
# Standard variables (pr/rsds) for the truncated SSP245 members 007-010, whose data ends
# 2069-12-31; predict_period_end is clamped to 2069 so the members are not downscaled past
# their valid data extent. Member 006 is not here: its extent ends 2069-12-30. It runs in
# cesm2-waccm6-ssp245-member006-2068.yaml instead. Their
# tas is produced by cesm2-waccm6-ssp245-tas-global-trunc-2069.yaml (also @2069) —
# it is intentionally omitted here to avoid a duplicate output. Full-length members 001-005
# live in cesm2-waccm6-ssp245-std.yaml (2099). Their tasmax/tasmin/dtr are in
# cesm2-waccm6-ssp245-tmx.yaml (also clamped to 2069).
#
# Equivalent CLI command:
#   uv run saidownscale run --config-path configs/production/

# === DownscalingConfig: Run Identity ===
gcm: "CESM2-WACCM6"
variables: ["pr", "rsds"]
ensemble_members: ["007", "008", "009", "010"]
scenarios: ["SSP245"]

downscaling_methods: ["BCSD", "QDMSD"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2069

# === PipelineOptions: Operational Settings ===
scratch_dir: "s3://carbonplan-srm/scratch/cache"
output_dir: "s3://us-west-2.opendata.source.coop/carbonplan/srm-downscaling/output/"

environment: "production"
# version intentionally unset — derived from the installed package version at runtime
verbose: true
save_intermediate: true
