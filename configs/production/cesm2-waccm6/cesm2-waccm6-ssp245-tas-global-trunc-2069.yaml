# BCSD configuration: CESM2-WACCM6 / tas / SSP245 / truncated members 007-010 / global (production)
# Members 007-010's data ends in 2069-12-31 (per saidownscale.validation._MEMBER_TIME_BOUNDS), so
# predict_period_end is 2069. Member 006 ends a day earlier and runs in
# cesm2-waccm6-ssp245-member006-2068.yaml instead. These were previously
# mis-truncated at 2070 in a separate cesm2-waccm6-ssp245-tas-global-trunc-2070.yaml config
# now folded in here: the raw input's apparent extra day at 2070-01-01 was the last 2069
# daily mean carrying an end-of-interval stamp, which issue #521 corrected at the ETL.
# Full-length members 001-005 reach 2099.

# === Model and Scenario ===
gcm: "CESM2-WACCM6"
variables: ["tas"]
ensemble_members: ["007", "008", "009", "010"]
scenarios: ["SSP245"]

downscaling_methods: ["BCSD", "QDMSD"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2069

# === Storage ===
scratch_dir: "s3://carbonplan-srm/scratch/cache"
output_dir: "s3://us-west-2.opendata.source.coop/carbonplan/srm-downscaling/output/"

environment: "production"
# version intentionally unset — derived from the installed package version at runtime

# === Additional Options ===
verbose: true
save_intermediate: true
