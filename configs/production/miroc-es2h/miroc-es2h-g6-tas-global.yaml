# BCSD configuration: MIROC-ES2H / tas / G6-1.5K / all members / global (production)

# === Model and Scenario ===
gcm: "MIROC-ES2H"
variables: ["tas"]
ensemble_members: ["r01", "r02", "r03", "r04", "r05", "r06", "r07", "r08", "r09", "r10"]
scenarios: ["G6-1.5K"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2084

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-srm/output"
environment: "production"
# version intentionally unset — derived from the installed package version at runtime

# === Bias Correction ===
mapping_type: "nonparametric_hybrid"

# === Additional Options ===
verbose: true
save_intermediate: true
