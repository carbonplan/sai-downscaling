# BCSD configuration: UKESM / tas / G6-1.5K / all members / global (production)

# === Model and Scenario ===
gcm: "UKESM"
variables: ["tas"]
ensemble_members: ["r2i1p1f2", "r3i1p1f2", "r12i1p1f2"]
scenarios: ["G6-1.5K"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2035
predict_period_end: 2084

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/cache"
output_dir: "s3://us-west-2.opendata.source.coop/carbonplan/srm-downscaling/output/"

environment: "production"
# version intentionally unset — derived from the installed package version at runtime

# === Bias Correction ===
debias_approach: "nonparametric_hybrid_2sided"

# === Additional Options ===
verbose: true
save_intermediate: true
