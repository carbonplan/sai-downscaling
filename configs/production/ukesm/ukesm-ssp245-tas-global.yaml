# BCSD configuration: UKESM / tas / SSP245 / all members / global (production)

# === Model and Scenario ===
gcm: "UKESM"
variables: ["tas"]
ensemble_members: ["r2i1p1f2", "r3i1p1f2", "r12i1p1f2"]
scenarios: ["SSP245"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2099

# === Downscaling Method ===
# "BCSD" (detrend + quantile mapping) or "QDMSD" (quantile delta mapping). Required:
# there is no default, so every config states which method produced its output.
downscaling_method: "BCSD"

# === Storage ===
scratch_dir: "s3://carbonplan-srm/scratch/cache"
output_dir: "s3://us-west-2.opendata.source.coop/carbonplan/srm-downscaling/output/"

environment: "production"
# version intentionally unset — derived from the installed package version at runtime

# === Additional Options ===
verbose: true
save_intermediate: true
