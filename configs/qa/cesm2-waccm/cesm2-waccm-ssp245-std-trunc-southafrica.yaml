# BCSD configuration: CESM2-WACCM / standard variables / SSP245 / truncated members 006-010 / South Africa (QA)
# These members end early (006 -> 2069, 007-010 -> 2070); predict_period_end clamped to 2069
# (group min) so no member is downscaled past its valid data extent. Full-length members
# 001-005 live in cesm2-waccm-ssp245-std-southafrica.yaml.

# === Model and Scenario ===
gcm: "CESM2-WACCM"
variables: ["tas", "pr", "rsds", "hurs"]
ensemble_members: ["006", "007", "008", "009", "010"]
scenarios: ["SSP245"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2069

# === Spatial Subsetting ===
# South Africa region: [lat_min, lat_max, lon_min, lon_max]
subset_bounds: [-35, -22, 16, 33]

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"

# === Bias Correction ===
mapping_type: "nonparametric_hybrid"

# === Additional Options ===
verbose: true
save_intermediate: true
