# BCSD configuration: CESM2-WACCM / tasmax+tasmin+dtr / SSP245 / member 006 / South Africa (QA)
# Members 001-005 have the CMIP6 tasmax/tasmin bug and are excluded; 006-010 use the
# corrected historical run ("001"). Member 006's data ends 2069-12-31 (per
# srm.validation._MEMBER_TIME_BOUNDS), so predict_period_end is 2069. Members 007-010
# end 2070 and live in cesm2-waccm-ssp245-tmx-2070-southafrica.yaml; splitting by true
# data end keeps each member's temperature-extremes extent consistent with its standard
# variables and with the production / snapshot runs.

# === Model and Scenario ===
gcm: "CESM2-WACCM"
variables: ["tasmax", "tasmin", "dtr"]
ensemble_members: ["006"]
scenarios: ["SSP245"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2069

# === Spatial Subsetting ===
# South Africa region: [lat_min, lat_max, lon_min, lon_max]
subset_bounds: [-35, -22, 16, 33]

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"

# === Bias Correction ===
debias_approach: "nonparametric_hybrid_2sided"

# === Additional Options ===
verbose: true
save_intermediate: true
