# BCSD configuration: CESM2-WACCM / tasmax+tasmin+dtr / SSP245 / members 006-010 / South Africa (QA)
# Members 001-005 have the CMIP6 tasmax/tasmin bug and are excluded; 006-010 use the
# corrected historical run ("001"). Members 006-010's data ends in 2069 (per
# srm.validation._MEMBER_TIME_BOUNDS: 007-010 on 2069-12-31, 006 a day earlier), so
# predict_period_end is 2069. These were previously mis-truncated at 2070 in a separate
# cesm2-waccm-ssp245-tmx-2070-southafrica.yaml config now folded in here: the raw input's
# apparent extra day at 2070-01-01 was the last 2069 daily mean carrying an end-of-interval
# stamp, which issue #521 corrected at the ETL.

# === Model and Scenario ===
gcm: "CESM2-WACCM"
variables: ["tasmax", "tasmin", "dtr"]
ensemble_members: ["008"]
scenarios: ["SSP245"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2069

# === Spatial Subsetting ===
# South Africa region: [lat_min, lat_max, lon_min, lon_max]
subset_bounds: [-35, -22, 16, 33]

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"

# === Additional Options ===
verbose: true
save_intermediate: true
