# BCSD configuration: MIROC-ES2H / all variables / G6-1.5K / all members / South Africa (QA)
# All 7 variables available for all members; no CMIP6 tasmax/tasmin bug in MIROC-ES2H.

# === Model and Scenario ===
gcm: "MIROC-ES2H"
variables: ["tas", "pr", "rsds", "hurs", "tasmax", "tasmin", "dtr"]
ensemble_members:
  ["r01", "r02", "r03", "r04", "r05", "r06", "r07", "r08", "r09", "r10"]
scenarios: ["G6-1.5K"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2035
predict_period_end: 2084

# === Downscaling Method ===
# "BCSD" (detrend + quantile mapping) or "QDMSD" (quantile delta mapping). Required:
# there is no default, so every config states which method produced its output.
downscaling_method: "BCSD"

# === Spatial Subsetting ===
# All of South Africa ([-35, -22, 16, 33]) plus a ~3 deg halo. subset_space applies a hard
# slice with no padding, so the regrid and spatial disaggregation edge effects land on the
# box boundary; the halo keeps them outside the region of interest. Matches the bounds used
# by configs/snapshot/cesm2-waccm/.
subset_bounds: [-38, -19, 13, 36]

# === Storage ===
# Same scratch prefix as every other QA and production config, so the obs and
# fit_historical artifacts shared with the SSP245 config are reused from cache.
scratch_dir: "s3://carbonplan-srm/scratch/cache"
output_dir: "s3://carbonplan-srm/scratch/output"
environment: "qa"

# === Additional Options ===
verbose: true
save_intermediate: true
