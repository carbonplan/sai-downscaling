# BCSD comparison config: CESM2-WACCM / tas+pr / ERA5 obs
# Standard variables (tas, pr) shared with GDEX-GMF, member 003, full-length (2099).

gcm: "CESM2-WACCM"
variable: ["tas", "pr"]
ensemble_member: "003"
scenario: "SSP245"
obs_dataset: "ERA5"

subset_bounds: [-35, -22, 16, 33]

train_period_start: 1960
train_period_end: 2008
predict_period_start: 2015
predict_period_end: 2099

scratch_dir: "s3://carbonplan-srm/scratch/obs-comparison/cache"
output_dir: "s3://carbonplan-srm/scratch/obs-comparison/output"
environment: "qa"
verbose: true
save_intermediate: true
