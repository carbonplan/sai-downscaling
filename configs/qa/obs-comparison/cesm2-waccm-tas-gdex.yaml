# BCSD comparison config: CESM2-WACCM / tas / GDEX-GMF obs

gcm: "CESM2-WACCM"
variable: "tas"
ensemble_member: "003"
scenario: "SSP245"
obs_dataset: "GDEX-GMF-icechunk"

subset_bounds: [-35, -22, 16, 33]

train_period_start: 1978
train_period_end: 2010
predict_period_start: 2015
predict_period_end: 2100

scratch_dir: "s3://carbonplan-srm/output/qa/bcsd-cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"
mapping_type: "nonparametric_hybrid"
verbose: true
save_intermediate: true
