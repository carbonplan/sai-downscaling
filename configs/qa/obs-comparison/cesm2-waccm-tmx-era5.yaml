# BCSD comparison config: CESM2-WACCM / tasmax+tasmin / ERA5 obs
# tasmax/tasmin/dtr require corrected run: members 006-010 only (001-005 have CMIP6 bug).
# Member 006, truncated end 2069.

gcm: "CESM2-WACCM"
variable: ["tasmax", "tasmin"]
ensemble_member: "006"
scenario: "SSP245"
obs_dataset: "ERA5"

subset_bounds: [-35, -22, 16, 33]

train_period_start: 1960
train_period_end: 2008
predict_period_start: 2015
predict_period_end: 2069

# === Downscaling Method ===
# "BCSD" (detrend + quantile mapping) or "QDMSD" (quantile delta mapping). Required:
# there is no default, so every config states which method produced its output.
downscaling_method: "BCSD"

scratch_dir: "s3://carbonplan-srm/scratch/obs-comparison/cache"
output_dir: "s3://carbonplan-srm/scratch/obs-comparison/output"
environment: "qa"
verbose: true
save_intermediate: true
