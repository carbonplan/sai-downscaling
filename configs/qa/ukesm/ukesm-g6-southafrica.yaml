# BCSD configuration: UKESM / all variables / G6-1.5K / all members / South Africa (QA)
# All 7 variables available for all members under the consolidated ripf-keyed G6-1.5K store.

# === Model and Scenario ===
gcm: "UKESM"
variables: ["tas", "pr", "rsds", "hurs", "tasmax", "tasmin", "dtr"]
ensemble_members: ["r2i1p1f2", "r3i1p1f2", "r12i1p1f2"]
scenarios: ["G6-1.5K"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2035
predict_period_end: 2084

# === Spatial Subsetting ===
subset_bounds: [-31, -26, 23, 30]

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"

# === Bias Correction ===
debias_approach: "nonparametric_hybrid_2sided"

# === Additional Options ===
verbose: true
save_intermediate: true
