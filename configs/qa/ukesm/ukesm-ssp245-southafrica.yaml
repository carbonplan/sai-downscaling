# BCSD configuration: UKESM / all variables / SSP245 / all members / South Africa (QA)
# All 7 variables available for all members under the consolidated ripf-keyed SSP245 store.

# === Model and Scenario ===
gcm: "UKESM"
variables: ["tas", "pr", "rsds", "hurs", "tasmax", "tasmin", "dtr"]
ensemble_members: ["r2i1p1f2", "r3i1p1f2", "r12i1p1f2"]
scenarios: ["SSP245"]

# === Time Periods ===
train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2099

# === Spatial Subsetting ===
subset_bounds: [-31, -26, 23, 30]

# === Storage ===
scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"

# === Additional Options ===
verbose: true
save_intermediate: true
