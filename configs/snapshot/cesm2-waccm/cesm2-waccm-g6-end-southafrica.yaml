# Snapshot proxy: CESM2-WACCM / G6-1.5K-END / member 002 / all variables / South Africa.
# Mirrors configs/production/cesm2-waccm/cesm2-waccm-g6-end.yaml with SA bounds + qa env.
#
# Member 002 is the only run continued to termination, which is also why the g6-1.5k
# proxy alongside this one carries 002 as well as 003: the terminated and continued legs
# have to be the same realization to be worth diffing against each other.
#
# Until a production run writes g6_1p5k_end and srm/snapshot/baselines.py is repointed at
# it, these leaves have no counterpart in the baseline and the comparison reports them as
# one-sided rather than in or out of tolerance. That is the expected reading, not a
# failure; the leaf inventory still confirms the candidate wrote everything configured.
gcm: "CESM2-WACCM"
variables: ["tas", "pr", "rsds", "hurs", "tasmax", "tasmin", "dtr"]
ensemble_members: ["002"]
scenarios: ["G6-1.5K-END"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2085
predict_period_end: 2100


# Run over a ~3 deg halo beyond the region of interest ([-35, -22, 16, 33]) so BCSD's
# regrid + spatial disaggregation edge effects fall outside it. The comparison notebook
# trims back to the region of interest (roi_bounds) before diffing.
subset_bounds: [-38, -19, 13, 36]

scratch_dir: "s3://carbonplan-srm/scratch/snapshot/cache"
output_dir: "s3://carbonplan-srm/scratch/snapshot/output"
environment: "qa"
verbose: true
save_intermediate: true
