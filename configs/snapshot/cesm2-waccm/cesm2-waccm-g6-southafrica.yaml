# Snapshot proxy: CESM2-WACCM / G6-1.5K / member 003 / all variables / South Africa.
# Mirrors configs/production/cesm2-waccm/cesm2-waccm-g6.yaml with SA bounds + qa env.
gcm: "CESM2-WACCM"
variables: ["tas", "pr", "rsds", "hurs", "tasmax", "tasmin", "dtr"]
ensemble_members: ["003"]
scenarios: ["G6-1.5K"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2084

mapping_type: "nonparametric_hybrid"

subset_bounds: [-35, -22, 16, 33]

scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"
verbose: true
save_intermediate: true
