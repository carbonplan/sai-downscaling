# Snapshot proxy: CESM2-WACCM / SSP245 / standard variables / South Africa.
# Mirrors configs/production/cesm2-waccm/cesm2-waccm-ssp245-std.yaml with SA
# bounds + qa env. Standard variables (tas/pr/rsds/hurs) exist for SSP245 members
# 001-010; members 003 and 008 are the std bridges for G6-1.5K/003. Temperature
# extremes are split into cesm2-waccm-ssp245-tmx-southafrica.yaml.
gcm: "CESM2-WACCM"
variables: ["tas", "pr", "rsds", "hurs"]
ensemble_members: ["003", "008"]
scenarios: ["SSP245"]

train_period_start: 1978
train_period_end: 2014
predict_period_start: 2015
predict_period_end: 2100

mapping_type: "nonparametric_hybrid"

subset_bounds: [-35, -22, 16, 33]

scratch_dir: "s3://carbonplan-scratch/srm/bcsd-cache"
output_dir: "s3://carbonplan-scratch/srm/output"
environment: "qa"
verbose: true
save_intermediate: true
