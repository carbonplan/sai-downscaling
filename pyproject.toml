[project]
name = "srm"
version = "0.1.0"
description = "SRM"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "arro3-core>=0.6.1",
    "bokeh>=3.8.0",
    "cf-xarray>=0.10.9",
    "cloudpathlib>=0.22.0",
    "coiled>=1.118.3",
    "dask[complete]>=2025.7.0",
    "distributed>=2025.7.0",
    "flox>=0.10.6",
    "gcsfs>=2025.7.0",
    "h5netcdf>=1.6.4",
    "icechunk>=1.1.4",
    "intake-esm>=2025.7.9",
    "ipython>=9.5.0",
    "jupyter>=1.1.1",
    "jupyter-server-proxy>=4.4.0",
    "matplotlib>=3.10.6",
    "netcdf4>=1.7.2",
    "obstore>=0.8.1",
    "pandas>=2.3.2",
    "pre-commit>=4.3.0",
    "pyarrow>=21.0.0",
    "s3fs>=2025.7.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.1",
    "virtualizarr[hdf,icechunk]>=2.1.1",
    "xarray[accel,io]>=2025.8.0",
    "xclim>=0.58.1",
    "zarr>=3.1.2",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
