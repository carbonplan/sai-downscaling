[project]
    dependencies = [
        "cartopy>=0.25.0",
        "cftime>=1.6.5",
        "cloudpathlib>=0.23.0",
        "dask[complete]>=2025.12.0",
        "distributed>=2025.12.0",
        "flox>=0.11.1",
        "frisky>=0.7",
        "geopandas>=1.1.3",
        "ibicus>=1.2.0",
        "icechunk>=2.0.0",
        "netcdf4>=1.7.4",
        "obstore>=0.8.2",
        "pint-xarray>=0.6.0",
        "pyarrow>=23.0.1",
        "pydantic-settings>=2.12.0",
        "pyyaml>=6.0.2",
        "rasterix>=0.2.1",
        "rich>=13.0.0",
        "rusterize>=0.8.0",
        "s3fs>=0.4.2",
        "tabulate>=0.9.0",
        "typer>=0.21.2",
        "xarray-regrid>=0.4.2",
        "xarray[accel]>=2025.12.0",
        "zarr>=3.1.5",
]
    description = "SRM"
    dynamic = ["version"]
    name = "srm"
    readme = "README.md"
    requires-python = ">=3.13, <3.13.6"

[project.scripts]
    bcsd = "srm.cli:app"

[build-system]
    build-backend = "setuptools.build_meta"
    requires      = ["setuptools-scm[toml]>=6.2", "setuptools>=64", "wheel"]

[tool.setuptools_scm]
    fallback_version = "999"
    local_scheme     = "node-and-date"
    version_scheme   = "post-release"

[tool.uv]
    no-build-package = ["netcdf4"]

[tool.uv.sources]
    srm = { workspace = true, editable = true }

[tool.pytest.ini_options]
    addopts = "-m 'not input_data and not slow' -ra --cov-report=term-missing --cov-report=xml --cov=src/srm "
    markers = [
        "input_data: marks tests that validate external input datasets (run with 'pytest -m input_data')",
        "slow: marks tests that require S3/source data access (run with 'pytest -m slow')",
        "snapshot: marks snapshot regression tests against the stored baseline (run with 'pytest -m snapshot')",
    ]

[dependency-groups]
    test = [
        "ipdb>=0.13.13",
        "prek>=0.3.0",
        "pytest-cov>=7.0.0",
        "pytest-xdist>=3.8.0",
        "pytest>=9.0.2",
    ]

    coiled-deploy = [
        "bokeh>=3.8.2",
        "coiled>=1.130.0",
        "ipykernel>=7.1.0",
        "jupyter-server-proxy>=4.4.0",
        "jupyter>=1.1.1",
    ]

    input-data = [
        "boto3>=1.42.22",
        "cf-xarray>=0.10.10",
        "click>=8.3.1",
        "h5netcdf>=1.7.3",
        "h5py==3.14.0",
        "obspec-utils>=0.9.0",
        "s3fs>=2026.1.0",
        "virtualizarr>=2.6.1",
        "xclim>=0.59.1",
    ]

    qa = [
        "arro3-core>=0.6.5",
        "duckdb>=1.4.3",
        "hvplot>=0.12.2",
        "intake-esm>=2025.12.12",
        "matplotlib>=3.10.8",
        "nc-time-axis>=1.4.1",
        "pooch>=1.8.2",
        "rasterio>=1.5.0",
        "seaborn>=0.13.2",
        "sparse>=0.17.0",
    ]

    dev = [
        "gilknocker==0.4.1",
        "memory-profiler>=0.61.0",
        { include-group = "coiled-deploy" },
        { include-group = "input-data" },
        { include-group = "qa" },
        { include-group = "test" },
    ]

    docs = [
        "ipykernel>=6",
        "myst-nb>=1.4.0",
        "sphinx-autobuild>=2025.8.25",
        "sphinx-book-theme>=1.1.4",
        "sphinx-click>=6.2.0",
        "sphinx-copybutton>=0.5.2",
        "sphinx-design>=0.7.0",
        "sphinxcontrib-mermaid>=2.0.0",
        "sphinxext-opengraph>=0.13.0",
    ]

[tool.ruff]
    builtins = ["ellipsis"]
    exclude = [
        ".bzr",
        ".direnv",
        ".eggs",
        ".git",
        ".git-rewrite",
        ".hg",
        ".ipynb_checkpoints",
        ".mypy_cache",
        ".nox",
        ".pants.d",
        ".pyenv",
        ".pytest_cache",
        ".pytype",
        ".ruff_cache",
        ".svn",
        ".tox",
        ".venv",
        ".vscode",
        "__pypackages__",
        "_build",
        "buck-out",
        "build",
        "dist",
        "node_modules",
        "site-packages",
        "venv",
    ]
    extend-include = ["*.ipynb"]
    line-length = 100
    target-version = "py313"

[tool.ruff.lint]
    ignore = [
        "E501", # Conflicts with ruff format
        "E721", # Comparing types instead of isinstance
        "E741", # Ambiguous variable names
    ]
    per-file-ignores = {}
    select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.mccabe]
    max-complexity = 18

[tool.ruff.lint.isort]
    combine-as-imports = true
    known-first-party  = []

[tool.ruff.format]
    docstring-code-format = true
    quote-style           = "double"

[tool.ruff.lint.pydocstyle]
    convention = "numpy"

[tool.ruff.lint.pyupgrade]
    keep-runtime-typing = true
