[project]
    dependencies = [
        "arro3-core>=0.6.3",
        "boto3>=1.40.18",
        "cf-xarray>=0.10.9",
        "cftime>=1.6.5",
        "click>=8.3.1",
        "cloudpathlib>=0.22.0",
        "coiled>=1.130.0",
        "dask[complete]>=2025.7.0",
        "distributed>=2025.7.0",
        "gilknocker==0.4.1",
        "h5py>=3.15.1",
        "icechunk>=1.1.14",
        "ipykernel>=7.1.0",
        "ipython>=9.6.0",
        "jupyter>=1.1.1",
        "jupyter-server-proxy>=4.4.0",
        "jupyterlab>=4.5.1",
        "netcdf4>=1.7.4",
        "obstore>=0.8.1",
        "pip<25.3.0",
        "virtualizarr>=2.1.2",
        "xarray[accel,io]",
        "zarr>=3.1.2",
]
    description = "SRM"
    name = "srm"
    readme = "README.md"
    requires-python = ">=3.13, <3.13.6"
    version = "0.1.0"

[project.optional-dependencies]

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.8.14,<0.9.0"]

[dependency-groups]
    coiled-deploy = [
        "bokeh>=3.8.0",
        "coiled>=1.129.4",
        "ipykernel>=6.30.1",
        "jupyter-server-proxy>=4.4.0",
        "jupyter>=1.1.1",
        "jupyterlab>=4.5.1",
]
dev = [
    "ipdb>=0.13.13",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
]


    input-data = [
        "virtualizarr>=2.1.2",
]

[tool.ruff]
    builtins = ["ellipsis"]
    exclude = [
        ".bzr",
        ".direnv",
        ".eggs",
        ".git",
        ".git-rewrite",
        ".hg",
        ".ipynb_checkpoints",
        ".mypy_cache",
        ".nox",
        ".pants.d",
        ".pyenv",
        ".pytest_cache",
        ".pytype",
        ".ruff_cache",
        ".svn",
        ".tox",
        ".venv",
        ".vscode",
        "__pypackages__",
        "_build",
        "buck-out",
        "build",
        "dist",
        "node_modules",
        "site-packages",
        "venv",
    ]
    extend-include = ["*.ipynb"]
    line-length = 100
    target-version = "py313"


[tool.ruff.lint]
    ignore = [
        "E501", # Conflicts with ruff format
        "E721", # Comparing types instead of isinstance
        "E741", # Ambiguous variable names
    ]
    per-file-ignores = {}
    select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.mccabe]
    max-complexity = 18

[tool.ruff.lint.isort]
    combine-as-imports = true
    known-first-party  = []

[tool.ruff.format]
    docstring-code-format = true
    quote-style           = "double"


[tool.uv.sources]
srm = { workspace = true, editable = true }

[tool.ruff.lint.pydocstyle]
    convention = "numpy"

[tool.ruff.lint.pyupgrade]
    keep-runtime-typing = true

[tool.uv]
no-build-package = ["netcdf4"]



[tool.pytest.ini_options]
# default don't run slow tests. -ra shows skip reasons in summary.
addopts = "-m 'not slow' -ra"

markers = [
    "slow: marks tests as slow/expensive (run with 'pytest -m slow')"
]