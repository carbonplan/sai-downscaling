
[tool.ruff]
    builtins = ["ellipsis"]
    exclude = [
        ".bzr",
        ".direnv",
        ".eggs",
        ".git",
        ".git-rewrite",
        ".hg",
        ".ipynb_checkpoints",
        ".mypy_cache",
        ".nox",
        ".pants.d",
        ".pyenv",
        ".pytest_cache",
        ".pytype",
        ".ruff_cache",
        ".svn",
        ".tox",
        ".venv",
        ".vscode",
        "__pypackages__",
        "_build",
        "buck-out",
        "build",
        "dist",
        "node_modules",
        "site-packages",
        "venv",
    ]
    extend-include = ["*.ipynb"]
    line-length = 100
    target-version = "py313"

[tool.ruff.lint]
    ignore = [
        "E501", # Conflicts with ruff format
        "E721", # Comparing types instead of isinstance
        "E741", # Ambiguous variable names
    ]
    per-file-ignores = {}
    select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.mccabe]
    max-complexity = 18

[tool.ruff.lint.isort]
    combine-as-imports = true
    known-first-party  = []

[tool.ruff.format]
    docstring-code-format = true
    quote-style           = "double"

[tool.ruff.lint.pydocstyle]
    convention = "numpy"

[tool.ruff.lint.pyupgrade]
    keep-runtime-typing = true

[project]
    dependencies = [
        "cf-xarray>=0.10.10",
        "cftime>=1.6.5",
        "click>=8.3.1",
        "cloudpathlib>=0.23.0",
        "dask[complete]>=2025.12.0",
        "distributed>=2025.12.0",
        "gilknocker==0.4.1",
        "icechunk>=1.1.15",
        "jupyter>=1.1.1",
        "netcdf4>=1.7.4",
        "obstore>=0.8.2",
        "pip>=25.3",
        "s3fs>=0.4.2",
        "tabulate>=0.9.0",
        "xarray-regrid>=0.4.1",
        "xarray>=2025.12.0",
        "xclim>=0.59.1",
        "zarr>=3.1.5",
    ]
    description = "SRM"
    name = "srm"
    readme = "README.md"
    requires-python = ">=3.13, <3.13.6"
    version = "0.1.0"

[build-system]
    build-backend = "uv_build"
    requires      = ["uv_build>=0.8.14,<0.9.0"]

[tool.uv.sources]
    srm = { workspace = true, editable = true }

[tool.pytest.ini_options]
    addopts = "-m 'not slow' -ra"
    markers = [
        "slow: marks tests as slow/expensive (run with 'pytest -m slow')",
    ]

[dependency-groups]
    test = [
        "ipdb>=0.13.13",
        "prek>=0.3.0",
        "pytest-xdist>=3.8.0",
        "pytest>=9.0.2",
]

    coiled-deploy = [
        "bokeh>=3.8.2",
        "coiled>=1.130.0",
        "ipykernel>=7.1.0",
        "jupyter-server-proxy>=4.4.0",
    ]

    input-data = [
        "boto3>=1.42.19",
        "h5netcdf>=1.7.3",
        "h5py==3.14.0",
        "obspec-utils>=0.9.0",
        "s3fs>=2026.1.0",
        "virtualizarr>=2.2.1",
]

    qa = [
        "arro3-core>=0.6.5",
        "duckdb>=1.4.3",
        "geopandas>=1.1.2",
        "hvplot>=0.12.2",
        "ibicus>=1.2.0",
        "matplotlib>=3.10.8",
        "pyarrow>=22.0.0",
        "rasterio>=1.5.0",
        "rasterix>=0.1a4",
        "seaborn>=0.13.2",
        "sparse>=0.17.0",
    ]

    dev = [
        { include-group = "coiled-deploy" },
        { include-group = "input-data" },
        { include-group = "qa" },
        { include-group = "test" },
    ]
